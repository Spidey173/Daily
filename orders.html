<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DailyDrop | My Orders</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="static/logo1.webp">

  <!-- Bootstrap, FontAwesome & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Centralized Stylesheet -->
  <link rel="stylesheet" href="static/css/main.css">
  
  <style>
    body {
      background-color: var(--bg-base);
    }
    
    .orders-page {
      max-width: 1000px;
      margin: 120px auto 60px;
      padding: 0 20px;
    }
    
    .orders-header {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .order-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-glass);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      transition: var(--transition-normal);
    }
    
    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--border-glow);
    }
    
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 16px;
    }
    
    .order-meta-info h3 {
      font-size: 1.25rem;
      font-weight: 850;
      color: var(--accent);
      margin-bottom: 6px;
    }
    
    .order-date-badge {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .order-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid rgba(12, 131, 31, 0.15);
      margin-top: 10px;
    }
    
    .order-cost-info {
      text-align: right;
    }
    
    .order-total-amount {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .order-delivery-address {
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 320px;
      line-height: 1.4;
    }
    
    .order-items-section {
      margin-top: 20px;
    }
    
    .section-subtitle {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    
    .order-items-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .product-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      background: var(--bg-base);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-glass);
      transition: var(--transition-fast);
    }
    
    .product-row:hover {
      border-color: var(--border-glass);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .product-row img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border: 1px solid var(--border-glass);
    }
    
    .product-row-info {
      flex: 1;
      min-width: 0;
    }
    
    .product-row-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .product-row-price {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .product-qty-badge {
      background: var(--primary);
      color: white;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    
    .empty-orders-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      padding: 60px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      max-width: 600px;
      margin: 40px auto;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    
    .empty-orders-icon {
      font-size: 4rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }
    
    .empty-orders-card h3 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
    }
    
    .empty-orders-card p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .shop-now-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: white;
      padding: 12px 30px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-normal);
    }
    
    .shop-now-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-primary-glow);
      color: white;
    }
    
    @media (max-width: 768px) {
      .order-card-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .order-cost-info {
        text-align: left;
        width: 100%;
        margin-top: 10px;
      }
      .order-delivery-address {
        max-width: 100%;
      }
    }
  </style>
  <script src="static/js/auth-nav.js"></script>
</head>
<body>

  <!-- Premium Sticky Floating Navbar -->
  <nav class="navbar">
      <div class="container navbar-container">
          <a href="index.html" class="logo">
              <i class="fas fa-shopping-basket"></i> Daily<span>Drop</span>
          </a>
          <div class="nav-actions">
            <a href="orders.html" class="login-btn-outline"><i class="fas fa-box"></i> My Orders</a>
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart"></i> My Cart <span id="cart-count">0</span>
            </a>
        </div>
      </div>
  </nav>

  <div class="orders-page">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h2 class="orders-header" style="margin-bottom: 0;"><i class="fas fa-box-open" style="color: var(--accent);"></i> My Orders</h2>
      <button id="clearOrdersBtn" onclick="clearAllOrders()" class="login-btn-outline" style="display: none; padding: 8px 16px; font-size: 0.9rem; border: 1px solid rgba(239, 68, 68, 0.4); color: #ef4444; background: rgba(239, 68, 68, 0.1);">
        <i class="fas fa-trash-alt me-1"></i> Clear History
      </button>
    </div>

    <div id="ordersContainer"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        loadOrders();
    });

    function clearAllOrders() {
        if (confirm("Are you sure you want to clear your order history?")) {
            localStorage.removeItem('orders');
            loadOrders();
        }
    }

    function loadOrders() {
        const container = document.getElementById('ordersContainer');
        const clearBtn = document.getElementById('clearOrdersBtn');
        const orders = JSON.parse(localStorage.getItem('orders')) || [];

        if (!orders || orders.length === 0) {
            if (clearBtn) clearBtn.style.display = 'none';
            container.innerHTML = `
                <div class="empty-orders-card">
                    <div class="empty-orders-icon"><i class="fas fa-box-open"></i></div>
                    <h3>No orders found</h3>
                    <p>You haven't placed any orders yet. Let's fill your kitchen with fresh items!</p>
                    <a href="index.html" class="shop-now-btn">
                        Start Shopping <i class="fas fa-shopping-basket"></i>
                    </a>
                </div>
            `;
            return;
        }

        if (clearBtn) clearBtn.style.display = 'inline-flex';

        let html = '';
        orders.forEach(order => {
            let productsHTML = '';
            if (order.products && Array.isArray(order.products)) {
                order.products.forEach(p => {
                    productsHTML += `
                        <div class="product-row">
                            <img src="${(p.image_path || p.image || '').replace(/^\//, '')}" alt="${escapeHTML(p.name)}">
                            <div class="product-row-info">
                                <h4 class="product-row-name">${escapeHTML(p.name)}</h4>
                                <div class="product-row-price">
                                    Rs. ${p.price} each
                                </div>
                            </div>
                            <span class="product-qty-badge">
                                ${p.quantity} item${p.quantity > 1 ? 's' : ''}
                            </span>
                        </div>
                    `;
                });
            }

            html += `
                <div class="order-card">
                    <div class="order-card-header">
                        <div class="order-meta-info">
                            <h3>Order #${order.order_id}</h3>
                            <div class="order-date-badge">
                                <i class="far fa-calendar-alt"></i>
                                Ordered on ${order.order_date}
                            </div>
                            <span class="order-status-badge">
                                <i class="fas fa-truck-loading"></i> On the Way (10 mins)
                            </span>
                        </div>
                        <div class="order-cost-info">
                            <div class="order-total-amount">
                                Rs. ${order.total_amount}
                            </div>
                            <div class="order-delivery-address">
                                <i class="fas fa-map-marker-alt me-1" style="color: var(--accent);"></i>
                                ${escapeHTML(order.address)}
                            </div>
                        </div>
                    </div>
                    
                    <div class="order-items-section">
                        <h4 class="section-subtitle">Items Ordered</h4>
                        <div class="order-items-grid">
                            ${productsHTML}
                        </div>
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
  </script>
</body>
</html>
